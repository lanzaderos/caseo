name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caseo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d caseo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - name: Cache Dialyzer PLTs
        uses: actions/cache@v6
        with:
          path: |
            ~/.mix/dialyxir_*.plt*
            _build/test/dialyxir_*.plt*
          key: plt-ubuntu24-${{ runner.arch }}-${{ hashFiles('.tool-versions', 'mix.lock', 'mix.exs') }}
      - name: Fetch test dependencies
        run: MIX_ENV=test mix deps.get --check-locked
      - name: Fetch frontend dependencies
        run: npm ci --include=dev
        working-directory: assets
      - name: Check formatting, compilation, Credo, tests and Dialyzer
        run: mix precommit
