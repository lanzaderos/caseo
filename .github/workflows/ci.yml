name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caseo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d caseo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - name: Cache Dialyzer PLTs
        uses: actions/cache@v6
        with:
          path: |
            ~/.mix/dialyxir_*.plt*
            _build/test/dialyxir_*.plt*
          key: plt-ubuntu24-${{ runner.arch }}-${{ hashFiles('.tool-versions', 'mix.lock', 'mix.exs') }}
      - name: Fetch test dependencies
        run: MIX_ENV=test mix deps.get --check-locked
      - name: Fetch frontend dependencies
        run: npm ci --include=dev
        working-directory: assets
      - name: Check formatting, compilation, Credo, tests and Dialyzer
        run: mix precommit

  release:
    name: Build production release
    needs: checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Fetch production dependencies
        run: mix deps.get --only prod --check-locked
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - name: Build assets and release
        run: |
          mix compile --warnings-as-errors
          mix assets.deploy
          mix release
          tar -czf caseo-linux-x86_64.tar.gz -C _build/prod/rel/caseo .
      - name: Upload production release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: caseo-linux-x86_64-${{ github.sha }}
          path: caseo-linux-x86_64.tar.gz
          if-no-files-found: error

  build_images:
    name: Build container image (${{ matrix.component }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - component: core
            context: .
          - component: whatsmeow
            context: whatsmeow
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false

  images:
    name: Publish container images
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ghcr.io/${{ github.repository }}
            context: .
          - image: ghcr.io/${{ github.repository }}-whatsmeow
            context: whatsmeow
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          # latest y sha en main; 1.2.3 y 1.2 en tags v1.2.3.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docs:
    name: Build and deploy documentation
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
        if: github.event_name == 'pull_request'
      - run: npm run deploy
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  required:
    name: CI required
    if: always() && github.event_name == 'pull_request'
    needs: [checks, release, build_images, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all pull request jobs to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$JOB_RESULTS"
          jq -e 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
